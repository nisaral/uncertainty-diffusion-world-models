<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="940" height="660" fill="#ffffff"/>
<text x="40" y="38" font-size="25" fill="#0f172a" font-weight="700">Why matching the teacher's uncertainty is not enough</text>
<text x="40" y="64" font-size="14.5" fill="#475569">The teacher's value-disagreement signal is ONE scalar,  w* + g* - Sigma-bar:  two unknowns.</text>
<text x="40" y="84" font-size="14.5" fill="#475569">A student can keep that number by trading ensemble disagreement w for aleatoric noise g.</text>
<text x="40" y="104" font-size="14.5" fill="#475569">Whether the trade helps or destroys the ranking is a property of the value map.</text>
<rect x="40" y="145" width="420" height="425" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="60" y="172" font-size="17" fill="#0f172a" font-weight="700">M = 1  -  one shared latent</text>
<text x="60" y="192" font-size="12.5" fill="#64748b">loss = matched scalar; level sets are lines of slope -1</text>
<line x1="100" y1="545" x2="420" y2="545" stroke="#94a3b8" stroke-width="1.4"/>
<line x1="100" y1="250" x2="100" y2="545" stroke="#94a3b8" stroke-width="1.4"/>
<text x="438" y="561" font-size="13" fill="#334155" font-style="italic">w  (ensemble disagreement)</text>
<text x="86" y="244" font-size="13" fill="#334155" font-style="italic" text-anchor="end">g  (aleatoric noise)</text>
<text x="88" y="569" font-size="11.5" fill="#94a3b8">0</text>
<text x="428" y="569" font-size="11.5" fill="#94a3b8">100</text>
<line x1="180" y1="250" x2="180" y2="545" stroke="#e2e8f0" stroke-width="1"/>
<line x1="100" y1="471.25" x2="420" y2="471.25" stroke="#e2e8f0" stroke-width="1"/>
<line x1="260" y1="250" x2="260" y2="545" stroke="#e2e8f0" stroke-width="1"/>
<line x1="100" y1="397.5" x2="420" y2="397.5" stroke="#e2e8f0" stroke-width="1"/>
<line x1="340" y1="250" x2="340" y2="545" stroke="#e2e8f0" stroke-width="1"/>
<line x1="100" y1="323.75" x2="420" y2="323.75" stroke="#e2e8f0" stroke-width="1"/>
<polygon points="100.0,291.3 375.2,545.0 336.8,545.0 100.0,326.7" fill="#dbeafe" opacity="0.7"/>
<line x1="100.0" y1="291.3" x2="375.2" y2="545.0" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="100.0" y1="326.7" x2="336.8" y2="545.0" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="176" y="288" font-size="12" fill="#1d4ed8" font-weight="600">sublevel set = a strip:</text>
<text x="176" y="304" font-size="12" fill="#1d4ed8">every (w,g) on this line</text>
<text x="176" y="320" font-size="12" fill="#1d4ed8">has the SAME matched loss</text>
<line x1="112.8" y1="309.0" x2="196.0" y2="385.7" stroke="#0f172a" stroke-width="1.8"/>
<path d="M 112.8 309.0 l 7 -3 m -7 3 l 3 7" stroke="#0f172a" stroke-width="1.8" fill="none"/>
<path d="M 196.0 385.7 l -7 3 m 7 -3 l -3 -7" stroke="#0f172a" stroke-width="1.8" fill="none"/>
<text x="116" y="414" font-size="11.5" fill="#0f172a" font-weight="600">1:1 trade direction</text>
<circle cx="132.0" cy="338.5" r="6.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.6"/>
<text x="196" y="236" font-size="13" fill="#b45309" font-weight="700">(w*, g*)  teacher</text>
<circle cx="106.4" cy="314.9" r="5" fill="#475569"/>
<circle cx="119.2" cy="326.7" r="5" fill="#475569"/>
<circle cx="144.8" cy="350.3" r="5" fill="#475569"/>
<circle cx="157.6" cy="362.1" r="5" fill="#475569"/>
<circle cx="183.2" cy="385.7" r="5" fill="#475569"/>
<text x="210" y="486" font-size="12.5" fill="#0f172a" font-weight="600">students: same loss, wrong (w,g)</text>
<rect x="480" y="145" width="420" height="425" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="500" y="172" font-size="17" fill="#0f172a" font-weight="700">M >= 2  -  paired latents</text>
<text x="500" y="192" font-size="12.5" fill="#64748b">two latent draws per state estimate w and g separately</text>
<line x1="540" y1="545" x2="860" y2="545" stroke="#94a3b8" stroke-width="1.4"/>
<line x1="540" y1="250" x2="540" y2="545" stroke="#94a3b8" stroke-width="1.4"/>
<text x="878" y="561" font-size="13" fill="#334155" font-style="italic">w  (ensemble disagreement)</text>
<text x="526" y="244" font-size="13" fill="#334155" font-style="italic" text-anchor="end">g  (aleatoric noise)</text>
<text x="528" y="569" font-size="11.5" fill="#94a3b8">0</text>
<text x="868" y="569" font-size="11.5" fill="#94a3b8">100</text>
<line x1="620" y1="250" x2="620" y2="545" stroke="#e2e8f0" stroke-width="1"/>
<line x1="540" y1="471.25" x2="860" y2="471.25" stroke="#e2e8f0" stroke-width="1"/>
<line x1="700" y1="250" x2="700" y2="545" stroke="#e2e8f0" stroke-width="1"/>
<line x1="540" y1="397.5" x2="860" y2="397.5" stroke="#e2e8f0" stroke-width="1"/>
<line x1="780" y1="250" x2="780" y2="545" stroke="#e2e8f0" stroke-width="1"/>
<line x1="540" y1="323.75" x2="860" y2="323.75" stroke="#e2e8f0" stroke-width="1"/>
<ellipse cx="572.0" cy="338.5" rx="24" ry="22" fill="#dcfce7" opacity="0.85" stroke="#16a34a" stroke-width="1.6"/>
<text x="616" y="228" font-size="12" fill="#15803d" font-weight="600">sublevel set collapses</text>
<text x="616" y="244" font-size="12" fill="#15803d">to a small ball around the</text>
<text x="616" y="260" font-size="12" fill="#15803d">true point  (rate ~ sqrt eps)</text>
<line x1="543.2" y1="311.9" x2="600.8" y2="365.1" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="3 5"/>
<text x="646" y="456" font-size="11.5" fill="#64748b" font-style="italic">M=1 degeneracy removed</text>
<circle cx="572.0" cy="338.5" r="6.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.6"/>
<text x="660" y="236" font-size="13" fill="#b45309" font-weight="700">(w*, g*)</text>
<circle cx="568.2" cy="336.1" r="4" fill="#16a34a"/>
<circle cx="574.6" cy="340.9" r="4" fill="#16a34a"/>
<circle cx="570.1" cy="339.7" r="4" fill="#16a34a"/>
<circle cx="576.5" cy="336.7" r="4" fill="#16a34a"/>
<circle cx="569.4" cy="334.4" r="4" fill="#16a34a"/>
<text x="560" y="520" font-size="12.5" fill="#0f172a" font-weight="600">students cluster on the true point</text>
<rect x="40" y="596" width="860" height="52" rx="8" fill="#f1f5f9"/>
<text x="56" y="616" font-size="13" fill="#0f172a" font-weight="700">Measured axes (DelayedBimodal policy runs): teacher g* ~ 73 vs teacher w* ~ 0.007  -  the g >> w hole that EMA reweighting converts into a U collapse.</text>
<text x="56" y="636" font-size="12.5" fill="#334155">Equal-weight M>=2 recovers both components; the EMA-reweighted arm (identified_hybrid) starves g and U falls to ~0 (DMC 30/30 collapse control).  Schematic: axes not to scale.</text>
</svg>