# Novelty A+B: U-gated imagination + adaptive MC-UBE budgets
seed: 0
device: cpu

env:
  id: Pendulum-v1
  max_episode_steps: 200

model:
  type: diffusion
  ensemble_size: 3
  hidden_dims: [128, 128]
  diffusion_steps: 6
  beta_start: 1.0e-4
  beta_end: 2.0e-2
  sample_steps: 2
  use_consistency_distill: false

reward_term:
  joint_with_diffusion: false
  hidden_dims: [64, 64]

# --- Novelty A ---
u_gate:
  mode: both              # off | stop | weight | both
  enable_after_steps: 600 # train U a bit before gating
  stop_threshold: null    # null → use stop_percentile on batch √U
  stop_percentile: 0.90   # stop top ~10% most uncertain steps
  weight_beta: 1.0        # weight = exp(-beta * √U)
  min_weight: 0.1
  min_store_weight: 0.05
  use_sqrt: true
  prioritized_model_sampling: true
  audit: true
  audit_path: runs/gate_audit.jsonl

ube:
  m_samples: 8
  u_min: 0.0
  hidden_dims: [128, 128]
  # --- Novelty B ---
  adaptive_mc:
    enabled: true
    m_min: 2
    m_max: 10
    m_probe: 2
    refine_frac: 0.4
    w_refine_percentile: 0.6
    k_min: 2
    k_max: 4

agent:
  gamma: 0.99
  tau: 0.005
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  alpha_lr: 3.0e-4
  auto_alpha: true
  target_entropy: null
  hidden_dims: [128, 128]
  batch_size: 128
  optimism_lambda: 0.3
  use_ube: true

mbpo:
  real_ratio: 0.05
  rollout_length: 3
  rollout_length_start: 1
  horizon_curriculum_steps: 800
  rollouts_per_step: 80
  model_train_freq: 200
  model_retain_epochs: 1
  num_model_epochs: 12
  model_batch_size: 128
  agent_updates_per_step: 5
  warmup_steps: 400
  total_env_steps: 2000
  eval_freq: 500
  log_freq: 100
  buffer_size: 50000
  model_buffer_size: 50000

paths:
  log_dir: runs
  checkpoint_dir: checkpoints
