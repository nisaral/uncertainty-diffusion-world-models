name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: "Include the exact command and the full error output."}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce, placeholder: "1. ...\n2. ..."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What did you expect?}
  - type: input
    id: env
    attributes: {label: Environment, placeholder: "OS, Python/Node version, commit SHA"}
  - type: markdown
    attributes: {value: "Please never paste API keys or .env contents."}
