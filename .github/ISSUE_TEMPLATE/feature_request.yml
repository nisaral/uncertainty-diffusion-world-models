name: Feature request or idea
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: What problem would this solve?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed change}
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
